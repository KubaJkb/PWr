<div class="backdrop" (click)="onCancel()"></div>
<dialog open>
  <h2>{{ dataToEdit() ? 'Edytuj towar' : 'Dodaj nowy towar' }}</h2>
  <form (ngSubmit)="onSubmit()">
    <p>
      <label for="name">Nazwa towaru</label>
      <input type="text" id="name" name="name" [(ngModel)]="enteredName" required />
    </p>
    
    <p>
      <label for="category">Kategoria</label>
      <select id="category" name="category" [(ngModel)]="enteredCategoryId">
        @for(cat of categories; track cat.id) {
          <option [value]="cat.id">{{ cat.name }}</option>
        }
      </select>
    </p>

    <p>
      <label for="price">Cena</label>
      <input type="number" id="price" name="price" [(ngModel)]="enteredPrice" min="0.01" step="0.01" required />
    </p>

    <p>
      <label for="date">Data ważności</label>
      <input type="date" id="date" name="date" [(ngModel)]="enteredDate" required />
    </p>

    <div class="actions">
      <button type="button" (click)="onCancel()">Anuluj</button>
      <button type="submit" class="primary">
        {{ dataToEdit() ? 'Zapisz' : 'Utwórz' }}
      </button>
    </div>
  </form>
</dialog>
